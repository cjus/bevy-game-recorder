name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain and components from rust-toolchain.toml.
      - run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --features demo -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features
      - run: cargo test
      - run: scripts/test-native.sh
